name: Release

# Runs when a version tag such as v2.0.0 is pushed. Builds
#   rtly-<version>-chrome.zip    for Chrome and Microsoft Edge
#   rtly-<version>-firefox.zip   for Firefox
# (manifest.json at the zip root, LICENSE included) and attaches both, with SHA-256 checksums,
# to a GitHub Release. The notes come from the matching CHANGELOG.md section.
# This workflow does not publish to any browser store; that stays a manual step.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate and test
        run: |
          npm run validate
          npm test

      - name: Assert tag matches manifest version
        run: |
          manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')).version")"
          if [ "${TAG}" != "v${manifest_version}" ]; then
            echo "::error::Tag '${TAG}' does not match extension/manifest.json version '${manifest_version}'. Expected 'v${manifest_version}'."
            exit 1
          fi
          echo "VERSION=${manifest_version}" >> "$GITHUB_ENV"

      - name: Build packages
        run: |
          npm run build
          npm run build:firefox
          for f in "dist/rtly-${VERSION}-chrome.zip" "dist/rtly-${VERSION}-firefox.zip"; do
            entries="$(unzip -Z1 "$f")"
            for required in manifest.json LICENSE; do
              echo "${entries}" | grep -qx "${required}" || { echo "::error::${required} is missing at the root of $f"; exit 1; }
            done
            if echo "${entries}" | grep -qE '^(extension/|tests/|docs/|scripts/|\.github/|dist/)'; then
              echo "::error::$f contains a project folder; manifest.json must be at the zip root."
              exit 1
            fi
          done
          unzip -p "dist/rtly-${VERSION}-firefox.zip" manifest.json | node -e "
            const m = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const problems = [];
            if (!m.background || !Array.isArray(m.background.scripts) || !m.background.scripts.length) problems.push('background.scripts is missing');
            if (m.background && m.background.service_worker) problems.push('background.service_worker must not be present');
            if (!m.browser_specific_settings || !m.browser_specific_settings.gecko || !m.browser_specific_settings.gecko.id) problems.push('gecko id is missing');
            if (m.version !== process.env.VERSION) problems.push('version ' + m.version + ' does not match ' + process.env.VERSION);
            if (problems.length) { console.error('::error::Firefox manifest: ' + problems.join('; ')); process.exit(1); }
          "
          cat dist/*.sha256

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "No CHANGELOG section found for ${VERSION}; using a short default."
            echo "RTLY ${VERSION}. See CHANGELOG.md for details." > dist/notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            "dist/rtly-${VERSION}-chrome.zip" \
            "dist/rtly-${VERSION}-chrome.zip.sha256" \
            "dist/rtly-${VERSION}-firefox.zip" \
            "dist/rtly-${VERSION}-firefox.zip.sha256" \
            --title "RTLY ${VERSION}" \
            --notes-file dist/notes.md \
            --verify-tag
